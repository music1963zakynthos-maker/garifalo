<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  /* ΕΝΩΜΕΝΟ & ΚΑΘΑΡΙΣΜΕΝΟ BODY (αφαιρέθηκε ο διπλός ορισμός και το άκυρο background: 100% 100%) */
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background-image: url('fonto.png');
    background-repeat: no-repeat;
    background-attachment: fixed; 
    background-size: 100% 100%;
  }
  body::after { 
    content: ""; 
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    background-color: rgba(0, 0, 0, 0.5); 
    z-index: -1; 
  }
  
  #loadingModal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .modal-content {
    background: rgba(20, 20, 20, 0.9);
    padding: 30px;
    border: 2px solid #00ffcc;
    border-radius: 15px;
    color: #00ffcc;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 0 30px #00ffcc;
    animation: pulse 1.5s infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(0, 255, 204, 0.1);
    border-top: 4px solid #00ffcc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .player-btn {
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.0) url('radio.png') center/cover no-repeat;
    color: #00ffcc; font-size: 20px; display: flex; align-items: flex-end; justify-content: center;
    position: absolute; top: 40px; z-index: 5;
    transition: transform .12s linear;
    text-shadow: 0 0 8px #00ffcc; font-weight: bold; padding-bottom: 10px;
    --glow-h: 174; 
    --glow-size: 20px;
    border: 4px solid hsl(var(--glow-h), 100%, 50%);
    box-shadow: 0 0 var(--glow-size) hsla(var(--glow-h), 100%, 50%, 0.8), 
                0 0 calc(var(--glow-size) / 2) hsla(var(--glow-h), 100%, 70%, 1);
  }
  #playBtn {
    position: absolute; top: 20px; right: 20px;
    width: 100px; height: 45px; border-radius: 8px;
    border: 2px solid #00ffcc; background: rgba(0, 0, 0, 0.5);
    color: #00ffcc; cursor: pointer; font-weight: bold; z-index: 100;
    box-shadow: 0 0 15px #00ffcc; display: flex; align-items: center; justify-content: center;
  }
  #skipIntroBtn {
    display: none;
    position: absolute; bottom: 20px; right: 20px;
    width: 130px; height: 40px; border-radius: 8px;
    border: 2px solid #ffcc00; background: rgba(0, 0, 0, 0.7);
    color: #ffcc00; cursor: pointer; font-weight: bold; z-index: 101;
    font-size: 13px; align-items: center; justify-content: center;
    box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); transition: 0.3s;
  }
  #skipIntroBtn:hover { background: #ffcc00; color: #000; box-shadow: 0 0 20px #ffcc00; }
  
  #status { position: absolute; top: 270px; font-weight: 700; letter-spacing: 1px; font-size: 30px; z-index: 6; }
  .onair { color: #00ff99; text-shadow: 0 0 10px #00ff99; }
  .offair { color: #ff6600; text-shadow: 0 0 12px #ff6600; }
  .loading { color: #ffaa00; text-shadow: 0 0 10px #ffaa00; }
  
  #equalizer { position: absolute; bottom: 0; width: 100%; height: 100vh; z-index: 1; }
  
  #nowPlaying {
    position: absolute;
    top: 390px;
    width: 90%;
    height: 50px;
    z-index: 4;
    overflow: hidden;
    white-space: nowrap;
    font-family: 'Montserrat', sans-serif;
    font-size: 29px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px #ff0000;
    display: flex;
    align-items: center;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
  }
  .scroll-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }
  .static-text {
    display: inline-block;
    width: 100%;
    text-align: center;
    animation: floatTitle 3s ease-in-out infinite alternate;
  }
  @keyframes floatTitle {
    from { transform: translateY(0px); opacity: 0.9; }
    to { transform: translateY(-5px); opacity: 1; }
  }
  
  #volumeControl {
    position: absolute; top: 330px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 5;
  }
  #volumeSlider { width: 250px; height: 5px; appearance: none; background: #333; border-radius: 5px; outline: none; box-shadow: 0 0 10px #00ffcc; }
  #volumeSlider::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #00ffcc; cursor: pointer; box-shadow: 0 0 10px #00ffcc; }
  #volumeValue { font-size: 18px; color: #00ffcc; text-shadow: 0 0 8px #00ffcc; width: 50px; text-align: left; }
  
  #effectBtn {
    position: absolute; top: 20px; left: 20px;
    width: 100px; height: 45px; border-radius: 8px;
    border: 2px solid #00ffcc; background: rgba(0, 0, 0, 0.5);
    color: #00ffcc; cursor: pointer; font-weight: bold; z-index: 100;
    box-shadow: 0 0 15px #00ffcc; display: flex; align-items: center; justify-content: center;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.35); border-radius: 10px; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#00ffcc,#00bfff); border-radius: 10px; box-shadow: 0 0 8px #00ffcc; }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg,#00ffff,#00ff99); box-shadow: 0 0 12px #00ffff; }
  html { scrollbar-width: thin; scrollbar-color: #00ffcc rgba(0,0,0,0.35); }
</style>
</head>
<body>

<div id="loadingModal">
  <div class="modal-content">
    <div id="modalText">Φόρτωση...</div>
    <div class="spinner"></div>
  </div>
</div>

<canvas id="equalizer"></canvas>
<div class="player-btn" id="visualizerCircle"></div>
<div id="playBtn">Play</div>
<div id="skipIntroBtn">Παράλειψη Intro</div>

<div id="status" class="offair">Πάτησε Play</div>
<div id="nowPlaying"><span class="static-text">Ράδιο Γαρύφαλλο LIVE</span></div>

<div id="volumeControl">
  <input type="range" id="volumeSlider" min="0" max="100" value="100">
  <span id="volumeValue">100%</span>
</div>

<div id="effectBtn">Wave 👆</div>

<script>                        
const STREAM_URL = "https://stream.zeno.fm/x8gduy6xd48uv";
const INTRO_URL = "Ξέρεις εσύ, για σένα το λέω.mp3";
const originalRadioName = "Ράδιο Γαρύφαλλο LIVE";

let audio = new Audio(); 
audio.crossOrigin = "anonymous";
let audioCtx, analyser, dataArray, bufferLength, sourceNode;
let isPlaying = false, retryIntervalMs = 60000;
let isIntroActive = false, hasIntroPlayed = false;
let metadataEventSource = null;

const btn = document.getElementById('playBtn');
const skipBtn = document.getElementById('skipIntroBtn');
const visualizerCircle = document.getElementById('visualizerCircle');
const statusEl = document.getElementById('status');
const nowPlayingEl = document.getElementById('nowPlaying');
const canvas = document.getElementById('equalizer');
const ctx = canvas.getContext('2d');
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const effectBtn = document.getElementById('effectBtn');
const loadingModal = document.getElementById('loadingModal');
const modalText = document.getElementById('modalText');

function resizeCanvas() { 
  canvas.width = window.innerWidth; 
  canvas.height = window.innerHeight; 
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setupAudioNodes() {
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  
  drawEqualizer();
  animateVisualizer(); // ΕΝΙΑΙΑ ΣΥΝΑΡΤΗΣΗ ΓΙΑ ROTATION ΚΑΙ BREATH EFFECT
}

const effects = [
  (ctx, data, w, h) => {
    ctx.clearRect(0, 0, w, h); // Bars - καθαρό
    const barWidth = (w / bufferLength) * 2.5;
    let x = 0;
    for(let i = 0; i < bufferLength; i++){
      const barHeight = data[i] * 0.65;
      ctx.fillStyle = `hsla(${(i * 5 + barHeight) % 360}, 100%, ${50 + barHeight / 5}%, 0.6)`;
      ctx.fillRect(x, h - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  },
  (ctx, data, w, h) => {
    ctx.clearRect(0, 0, w, h); // Stars - καθαρό (όχι μαύρο fillRect)
    let total = 0;
    for(let i = 0; i < bufferLength; i++) total += data[i];
    const avg = total / bufferLength / 255;
    const starCount = 80 + Math.floor(avg * 200);
    const time = Date.now() * 0.002;
    for(let i = 0; i < starCount; i++){
      const x = (i * 131.7 + time * 50) % w;
      const y = (i * 89.3 + time * 30) % h;
      const size = 1 + Math.sin(time * 5 + i) * avg * 4;
      const opacity = 0.6 + avg * 0.4;
      const hue = (i * 7 + time * 100) % 360;
      ctx.shadowBlur = 15 + avg * 25;
      ctx.shadowColor = `hsla(${hue}, 100%, 80%, ${opacity})`;
      ctx.fillStyle = `hsla(${hue}, 100%, 95%, ${opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.clearRect(0,0,w,h); // Circles - καθαρό
      const centerX = w / 2;
      const centerY = h / 2;
      const baseRadius = Math.min(centerX, centerY) * 0.1;
      const maxRadius = Math.min(centerX, centerY) * 1.5;
      for (let i = 0; i < bufferLength; i += 2) {
          const value = data[i];
          const radius = baseRadius + (maxRadius - baseRadius) * (value / 255);
          const hue = (i * 10) % 360;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.3)`;
          ctx.lineWidth = 2 + (value / 50);
          ctx.stroke();
      }
  },
  (ctx, data, w, h) => {
      ctx.clearRect(0, 0, w, h); // Wave - καθαρό (όχι μαύρο fillRect)
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      const sliceWidth = w * 1.0 / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
          const value = data[i];
          const y = (value / 128.0) * (h / 4) + (h / 2); 
          if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
          x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height / 2);
      let total = 0;
      for(let i=0; i<bufferLength; i++) total += data[i];
      const avg = total / bufferLength;
      const hue = (avg * 2) % 360;
      ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.5)`;
      ctx.stroke();
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.clearRect(0, 0, w, h); // Particles - καθαρό (όχι μαύρο fillRect)
      const centerX = w / 2;
      const centerY = h / 2;
      for(let i=0; i<bufferLength; i += 4) {
          const value = data[i];
          const angle = (i / bufferLength) * Math.PI * 2;
          const time = Date.now() * 0.001;
          const distance = 100 + value * (2 + Math.sin(time + i*0.1));
          const x = centerX + Math.cos(angle) * distance;
          const y = centerY + Math.sin(angle) * distance;
          const size = 2 + value / 20;
          const hue = (i * 15 + time * 50) % 360;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.6)`;
          ctx.shadowBlur = size * 2;
          ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.4)`;
          ctx.fill();
      }
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
    ctx.clearRect(0,0,w,h); // OFF - καθαρό
  }
];

let currentEffect = 3;
const effectNames = ["Bars", "★ Stars", "Circles", "Wave", "Particles", "OFF"];

function drawEqualizer() {
  requestAnimationFrame(drawEqualizer);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  // ΔΙΟΡΘΩΣΗ: Αφαιρέθηκε το ctx.clearRect από εδώ για να λειτουργούν σωστά τα trail effects
  effects[currentEffect](ctx, dataArray, canvas.width, canvas.height);
}

// ΕΝΙΑΙΑ ΣΥΝΑΡΤΗΣΗ ΑΝΙΜΕΙΣΟΝ (Αντικαθιστά τις ξεχωριστές rotateButton και startButtonBreath)
let rotation = 0;
let lastLevel = 0;
let animationRunning = false;

function animateVisualizer() {
  if (animationRunning) return;
  animationRunning = true;

  function step() {
    requestAnimationFrame(step);
    
    // Βασική περιστροφή αν παίζει
    if (isPlaying) {
      rotation += 0.2;
    }

    // Breath effect μόνο αν πληρούνται όλες οι προϋποθέσεις
    if (analyser && dataArray && isPlaying && !audio.paused && effectNames[currentEffect] !== "OFF") { 
      analyser.getByteFrequencyData(dataArray);
      let bassSum = 0;
      for (let i = 0; i < 10; i++) bassSum += dataArray[i];
      let averageBass = bassSum / 10;
      
      let colorOscillation = Math.sin(averageBass * 0.05) * 180 + 180;
      let musicHue = Math.floor(174 + colorOscillation) % 360;
      let currentLevel = averageBass / 255;
      let delta = currentLevel - lastLevel;
      if (delta < 0) delta = 0; 
      lastLevel = currentLevel; 
      
      let boost = Math.min(delta * 5, 0.4); 
      let targetGlow = Math.min(2.0, averageBass / 50);
      
      visualizerCircle.style.setProperty('--glow-size', Math.round(targetGlow * 130) + "px");
      visualizerCircle.style.setProperty('--glow-h', musicHue);
      visualizerCircle.style.transform = `scale(${1 + boost}) rotate(${rotation}deg)`;
    } else {
      visualizerCircle.style.setProperty('--glow-size', "0px");
      visualizerCircle.style.setProperty('--glow-h', "174");
      visualizerCircle.style.transform = `scale(1.0) rotate(${rotation}deg)`;
    }
  }
  requestAnimationFrame(step);
}

effectBtn.addEventListener('click', () => {
  currentEffect = (currentEffect + 1) % effects.length;
  effectBtn.textContent = effectNames[currentEffect];
});

volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
  volumeValue.textContent = `${volumeSlider.value}%`;
});

function updateUIWithTitle(titleText) {
  let finalTitle = titleText || originalRadioName;
  if (finalTitle.length > 20) {
    nowPlayingEl.innerHTML = `<span class="scroll-text">${finalTitle}</span>`;
  } else {
    nowPlayingEl.innerHTML = `<span class="static-text">${finalTitle}</span>`;
  }
  
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'RADIO_TITLE_UPDATE', title: finalTitle }, '*');
  }
}

function startMetadataListener() {
  if (metadataEventSource) {
    metadataEventSource.close();
  }
  metadataEventSource = new EventSource("https://api.zeno.fm/mounts/metadata/subscribe/x8gduy6xd48uv");
  
  metadataEventSource.onmessage = function(event) {
    try {
      const data = JSON.parse(event.data);
      if (data && data.streamTitle) {
        updateUIWithTitle(data.streamTitle);
      } else {
        updateUIWithTitle(originalRadioName);
      }
    } catch (e) {
      console.error("Metadata parse error", e);
    }
  };

  metadataEventSource.onerror = function() {
    console.log("Metadata connection lost, reconnecting...");
  };
}

function stopMetadataListener() {
  if (metadataEventSource) {
    metadataEventSource.close();
    metadataEventSource = null;
  }
}

async function playStream(url) {
  isIntroActive = false;
  skipBtn.style.display = "none";
  audio.pause(); 

  modalText.textContent = "Φόρτωση live streaming";
  loadingModal.style.display = "flex";
  statusEl.textContent = "Φόρτωση Live Streaming";
  statusEl.className = "loading"; 
  
  audio.src = url; // ΔΙΟΡΘΩΣΗ: Αφαιρέθηκε το περιττό audio.src = ""
  try {
    await audio.play();
    loadingModal.style.display = "none";
    statusEl.textContent = "ON AIR Radio Garifalo";
    statusEl.className = "onair";
    
    // ΔΙΟΡΘΩΣΗ: Εξασφάλιση σωστής κατάστασης ανεξάρτητα από το ποιος κάλεσε τη συνάρτηση (π.χ. skipBtn)
    isPlaying = true;
    btn.textContent = "Pause";
    
    startMetadataListener();
    startAutoRetry();
  } catch(e) {
    modalText.textContent = "Σφάλμα αναπαραγωγής. Παρακαλώ δοκιμάστε ξανά.";
    statusEl.textContent = "Σφάλμα σύνδεσης"; 
    statusEl.className = "offair";
    isPlaying = false;
    btn.textContent = "Play";
  }
}

async function startIntro() {
    isIntroActive = true;
    hasIntroPlayed = true;
    setupAudioNodes();
    audio.src = INTRO_URL;
    statusEl.textContent = "Παίζει Intro...";
    statusEl.className = "loading";
    updateUIWithTitle("Καλώς ήρθατε στο Ράδιο Γαρύφαλλο");
    skipBtn.style.display = "flex";
    try {
        await audio.play();
        isPlaying = true;
        btn.textContent = "Pause";
    } catch(e) { 
        playStream(STREAM_URL); 
    }
}

btn.addEventListener('click', () => {
  if(isPlaying) {
    audio.pause();
    btn.textContent = "Play"; 
    statusEl.textContent = "Παύση"; 
    statusEl.className = "offair"; 
    isPlaying = false;
    skipBtn.style.display = "none";
    loadingModal.style.display = "none";
    stopMetadataListener();
  } else {
    if(!hasIntroPlayed) {
        startIntro();
    } else {
        playStream(STREAM_URL);
    }
  }
});

// ΔΙΟΡΘΩΣΗ: Τώρα λειτουργεί σωστά γιατί η playStream διαχειρίζεται το isPlaying και το UI
skipBtn.addEventListener('click', () => { playStream(STREAM_URL); });

audio.addEventListener('error', () => { 
    if(isIntroActive) {
        playStream(STREAM_URL);
    } else {
        statusEl.textContent = "Σφάλμα ροής, επανασύνδεση..."; 
        statusEl.className = "offair";
        setTimeout(() => {
            if(!isPlaying) return;
            playStream(STREAM_URL);
        }, 5000);
    }
});

audio.addEventListener('ended', () => { 
    if(isIntroActive) {
        playStream(STREAM_URL); 
    }
});

function startAutoRetry() {
  if(window._playerRetryInterval) clearInterval(window._playerRetryInterval);
  window._playerRetryInterval = setInterval(() => {
    if(isPlaying && !isIntroActive && audio.paused && audio.ended === false) {
      audio.play().catch(() => {
        playStream(STREAM_URL);
      });
    }
  }, retryIntervalMs);
}
// Αυτόματη εκκίνηση αναπαραγωγής μόλις φορτώσει η σελίδα
window.addEventListener('DOMContentLoaded', () => {
    startIntro();
});
</script>
</body>
